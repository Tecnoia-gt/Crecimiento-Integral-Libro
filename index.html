:root{

html,body{height:100%}

.home{display:block;border-radius:6px}

.ttl{min-width:0}

.ttl p{margin:0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:8px}
#shell{transform-origin:50% 50%;transition:transform .9s cubic-bezier(.3,.1,.2,1)}
#book{margin:0 auto;filter:drop-shadow(0 18px 30px rgba(0,0,10,.45))}
#book,#book *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{overscroll-behavior:none}

.page.hard img{object-fit:cover}
footer{position:relative;padding-block:8px 30px}

.ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px}
html:not(.lee) .ctl{visibility:hidden}
#leer{position:absolute;left:50%;top:8px;translate:-50% 0;min-width:140px;padding:9px 26px;font-size:17px;letter-spacing:.04em;border-color:rgba(243,237,221,.55)}
html.lee #leer{display:none}
button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}

button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}

.nav{width:42px;height:42px;padding:0;font-size:22px;line-height:1;display:grid;place-items:center}

.folio b{color:var(--ink);font-weight:500}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-style:italic;color:var(--muted)}

.v3d:active{cursor:grabbing}
.v3d.gone{opacity:0;pointer-events:none}
.stage.closed #shell{visibility:hidden}

.b3 .bk{width:var(--w);height:var(--h);background:url(img/back.webp) center/cover;border-radius:4px 1px 1px 4px;transform:translate(-50%,-50%) rotateY(180deg) translateZ(calc(var(--t) / 2))}

</style>

}
const A0 = avail();
book.style.width = (A0.portrait ? A0.pw : A0.pw * 2) + 'px';
book.style.height = A0.ph + 'px';
const pf = new St.PageFlip(book, {
  width: A0.pw, height: A0.ph, size: 'fixed',
  showCover: true, maxShadowOpacity: 0.55, flippingTime: 900,
  mobileScrollSupport: false, showPageCorners: !matchMedia('(hover:none)').matches, usePortrait: A0.portrait, autoSize: false, drawShadow: true
});
pf.loadFromHTML(els);
document.getElementById('loading').remove();
hojasPorZona(pf, book, () => scale);

let scale = 1;
function place(i){
  // Libro cerrado: se centra la cubierta o la contracubierta.
  let dx = 0;
  if (!A0.portrait){ if (i === 0) dx = -A0.pw / 2; else if (i >= PAGES.length - 1) dx = A0.pw / 2; }
  shell.style.transform = 'translateX(' + dx * scale + 'px) scale(' + scale + ')';
}
function rescale(){
  const st = avail();
  // El libro conserva sus proporciones y se ajusta al espacio disponible (por ejemplo, al entrar en pantalla completa)
  scale = Math.min(st.ph / A0.ph, stage.clientWidth / (A0.portrait ? A0.pw : A0.pw * 2));
  place(pf.getCurrentPageIndex());
  // El libro cerrado en 3D tiene exactamente el tamaño de la página de lectura
  document.getElementById('b3').style.setProperty('--w', (A0.pw * scale) + 'px');
  document.getElementById('v3d').style.setProperty('--fh', (A0.ph * scale / 2) + 'px');
}
rescale();
addEventListener('resize', () => {
  // Al girar el teléfono entre vertical (una página) y horizontal (dos páginas), se rearma el libro en la misma página
  if (vertical() !== A0.portrait){
    const i = pf.getCurrentPageIndex(), closed = stage.classList.contains('closed');
    clearTimeout(window.__ro); window.__ro = setTimeout(() => { location.hash = closed ? '' : 'p' + i; location.reload(); }, 250);
    return;
  }
  rescale();
});
// Si se rearmó tras girar el teléfono, vuelve a la página donde estaba
const P0 = /^#p(\d+)$/.exec(location.hash);
if (P0 || celHoriz()){ setTimeout(() => { const n = P0 ? Math.min(+P0[1], PAGES.length - 1) : 0; aLeer(); warm(n); pf.turnToPage(n); show(n); place(n); }, 0); }
function aLeer(){ stage.classList.remove('closed'); document.getElementById('v3d').classList.add('gone'); HTML.classList.add('lee'); }

const folio = document.getElementById('folio');
function label(i){
  const p = PAGES[i];
  if (p.k === 'front' || p.k === 'back' || p.k === 'end') return '<b>' + p.label + '</b>';
  return 'Página <b>' + p.label + '</b>';
}
function show(i){
  const o = pf.getOrientation && pf.getOrientation() === 'landscape';
  let t = label(i);
  if (o && i > 0 && i < PAGES.length - 1){
    const a = i % 2 ? i : i - 1;
    const L = PAGES[a], R = PAGES[a + 1];
    if (L && R && L.k !== 'end' && R.k !== 'end' && L.k !== 'front') t = 'Páginas <b>' + L.label + '–' + R.label + '</b>';
  }
  folio.innerHTML = t;
}
pf.on('flip', e => { warm(e.data); show(e.data); place(e.data); });
pf.on('changeState', e => { if (e.data === 'flipping' || e.data === 'user_fold') rustle(); });

document.getElementById('prev').onclick = () => pf.flipPrev();
document.getElementById('next').onclick = () => { if (stage.classList.contains('closed')) return window.__openBook(); pf.flipNext(); };
document.getElementById('toc').onchange = e => {
  const v = e.target.value; if (v === '') return;
  const n = +v; aLeer(); warm(n); pf.turnToPage(n); show(n); place(n); e.target.value = '';
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight'){ if (stage.classList.contains('closed')) return window.__openBook(); pf.flipNext(); }
  if (e.key === 'ArrowLeft') pf.flipPrev();
});
// Celular en horizontal: al primer toque se pide pantalla completa (el navegador solo la concede tras un gesto).
// El iPhone no la permite en páginas web: ahí el libro igual ocupa toda la vista.
document.addEventListener('touchend', () => {
  if (!celHoriz() || document.fullscreenElement || document.webkitFullscreenElement) return;
  const r = document.documentElement, f = r.requestFullscreen || r.webkitRequestFullscreen;
  if (!f) return;
  try { const p = f.call(r, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (_) {}
}, { passive: true });

// ===== Vestíbulo: libro cerrado en 3D. No gira solo: se arrastra, se suelta donde se quiera o se lanza con impulso =====
(() => {
  const v = document.getElementById('v3d'), b = document.getElementById('b3'), fl = document.getElementById('b3floor');
  let ry = -28, rx = 6, vy = 0, vx = 0, drag = false, lx = 0, ly = 0, lt = 0, sx = 0, sy = 0, st0 = 0, moved = 0;
  const r = a => a * Math.PI / 180, L = 15;
  const sh = n => Math.max(0, Math.min(.5, .5 * (1 - Math.max(0, Math.cos(r(n - L))) * .96)));
  const set = () => {
    b.style.setProperty('--ry', ry + 'deg'); b.style.setProperty('--rx', rx + 'deg');
    b.style.setProperty('--shF', sh(-ry).toFixed(3)); b.style.setProperty('--shB', sh(180 - ry).toFixed(3));
    b.style.setProperty('--shS', sh(-90 - ry).toFixed(3)); b.style.setProperty('--shE', sh(90 - ry).toFixed(3));
    b.style.setProperty('--gx', (50 + Math.sin(r(ry)) * 70).toFixed(1) + '%');
    fl.style.setProperty('--fs', (.3 + .7 * Math.abs(Math.cos(r(ry)))).toFixed(3));
  };
  v.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    drag = true; lx = sx = e.clientX; ly = sy = e.clientY; lt = st0 = performance.now(); vy = vx = 0; moved = 0;
    v.setPointerCapture(e.pointerId);
  });
  v.addEventListener('pointermove', e => {
    if (!drag) return;
    const now = performance.now(), dt = Math.max(8, now - lt);
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; lt = now;
    moved = Math.max(moved, Math.hypot(e.clientX - sx, e.clientY - sy));
    ry += dx * .6; rx = Math.max(-35, Math.min(35, rx - dy * .35));
    vy = dx * .6 * (16 / dt); vx = -dy * .35 * (16 / dt); set();
  });
  const up = e => {
    if (!drag) return; drag = false;
    // Si lo sostuvo quieto un rato antes de soltar, se queda quieto
    if (performance.now() - lt > 90){ vy = vx = 0; }
    // Un toque breve sobre el libro, sin arrastrar, lo abre
    if (e.type === 'pointerup' && moved < 8 && performance.now() - st0 < 350 && e.target.closest('#b3')) openBook();
  };
  v.addEventListener('pointerup', up); v.addEventListener('pointercancel', up);
  const loop = () => {
    if (!drag && (Math.abs(vy) > .02 || Math.abs(vx) > .02)){
      ry += vy; rx = Math.max(-35, Math.min(35, rx + vx)); vy *= .975; vx *= .9; set();
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop); set();
  let opening = false;
  function openBook(){
    if (opening) return; opening = true;
    vy = vx = 0;
    // El libro se pone de frente, plano, en el mismo lugar y tamaño de la lectura, y se muestra la cubierta
    const target = Math.round(ry / 360) * 360;
    b.style.transition = 'transform .5s cubic-bezier(.3,.7,.2,1)';
    ry = target; rx = 0; set();
    pf.turnToPage(0); show(0); place(0); warm(0);
    setTimeout(() => {
      b.style.transition = '';
      aLeer(); opening = false;
    }, 520);
  }
  function closeBook(){
    pf.turnToPage(0); show(0); place(0);
    ry = -28; rx = 6; set();
    v.classList.remove('gone'); stage.classList.add('closed'); HTML.classList.remove('lee');
  }
  document.getElementById('leer').onclick = openBook;
  window.__openBook = openBook;
  // El logo de la cabecera vuelve al inicio: el libro cerrado en la portada
  document.getElementById('home').addEventListener('click', e => { e.preventDefault(); closeBook(); });
})();

// Sonido de papel sintetizado: ruido filtrado con envolvente corta.
let ac = null, soundOn = true, lastR = 0;
function rustle(){
  if (!soundOn) return;
  const now = performance.now(); if (now - lastR < 350) return; lastR = now;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.55, n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++){
      const t = i / n;
      const env = Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.15)), 1.6) * (0.6 + 0.4 * Math.random());
      d[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.6;
    bp.frequency.setValueAtTime(1800, ac.currentTime); bp.frequency.linearRampToValueAtTime(4200, ac.currentTime + dur);
    const g = ac.createGain(); g.gain.value = 0.09;
    src.connect(bp).connect(g).connect(ac.destination); src.start();
  } catch (_) {}
}
</script>
