<style>
/* Sala de lectura: el libro sobre un fondo navy de la editorial, controles discretos en crema. Un solo tema oscuro por diseño. */
:root{
  --ground:#0b0d33; --ground-2:#04044A; --ink:#f3eddd; --muted:#a9a7c4;
  --line:rgba(243,237,221,.18); --red:#CD0100; --paper:#f7f2e5; --end:#1b2147;
  --serif:"EB Garamond","Garamond","Georgia",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 40%,#1a1f5a 0%,var(--ground-2) 45%,var(--ground) 100%);background-color:var(--ground);color:var(--ink);font-family:var(--serif);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:14px;padding-block:14px 6px;min-width:0}
header img{height:30px;width:auto}
.ttl{min-width:0}
.ttl h1{margin:0;font-weight:500;font-size:clamp(15px,2.1vw,20px);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:8px}
#shell{transform-origin:50% 50%;transition:transform .9s cubic-bezier(.3,.1,.2,1)}
#book{margin:0 auto;filter:drop-shadow(0 18px 30px rgba(0,0,10,.45))}
.page{background:var(--paper);overflow:hidden}
.page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.page.end{background:var(--end) radial-gradient(circle at 50% 50%,rgba(255,255,255,.05),transparent 70%)}
.page.end .mono{position:absolute;inset:0;display:grid;place-items:center;opacity:.22}
.page.end .mono img{width:22%;height:auto;object-fit:contain;filter:brightness(0) invert(1)}
.page.blank{background:var(--paper)}
.page:not(.hard)::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.page.--left:not(.hard)::after{right:0;background:linear-gradient(to left,rgba(60,45,20,.22),rgba(60,45,20,0))}
.page.--right:not(.hard)::after{left:0;background:linear-gradient(to right,rgba(60,45,20,.22),rgba(60,45,20,0))}
.page.hard img{object-fit:cover}
footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;padding-block:8px 16px}
button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
button:hover,select:hover{border-color:rgba(243,237,221,.5)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
select option{background:var(--ground-2);color:var(--ink)}
.nav{width:42px;height:42px;padding:0;font-size:22px;line-height:1;display:grid;place-items:center}
.folio{min-width:150px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.folio b{color:var(--ink);font-weight:500}
.hint{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-style:italic;font-size:13px;color:var(--muted);pointer-events:none;transition:opacity .6s}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-style:italic;color:var(--muted)}
/* Vestíbulo: el libro cerrado en 3D; se agarra con el dedo o el ratón, se gira, se lanza y se queda donde lo suelten */
.v3d{position:absolute;inset:0;z-index:5;display:grid;place-items:center;align-content:center;gap:4px;perspective:1700px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:opacity .6s}
.v3d:active{cursor:grabbing}
.v3d.gone{opacity:0;pointer-events:none}
.stage.closed #shell,.stage.closed .hint{visibility:hidden}
.b3{--w:min(330px,58vw,calc((100dvh - 230px) / 1.62));--h:calc(var(--w) * 1.5);--t:calc(var(--w) * .046);--shF:0;--shB:.3;--shS:.3;--shE:.3;--gx:30%;position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;transform:rotateX(var(--rx,6deg)) rotateY(var(--ry,-28deg))}
.b3 .f{position:absolute;left:50%;top:50%;backface-visibility:hidden}
.b3 .f::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.b3 .cf{width:var(--w);height:var(--h);background:url(img/front.webp) center/cover;border-radius:1px 4px 4px 1px;transform:translate(-50%,-50%) translateZ(calc(var(--t) / 2))}
.b3 .cf::after{background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,0) 2.2%,transparent 3.6%,rgba(0,0,0,.12) 4.4%,rgba(255,255,255,.22) 5.1%,transparent 6.6%),linear-gradient(100deg,transparent calc(var(--gx) - 22%),rgba(255,255,255,.30) var(--gx),transparent calc(var(--gx) + 22%)),rgba(8,10,40,var(--shF))}
.b3 .bk{width:var(--w);height:var(--h);background:url(img/back.webp) center/cover;border-radius:4px 1px 1px 4px;transform:translate(-50%,-50%) rotateY(180deg) translateZ(calc(var(--t) / 2))}
.b3 .bk::after{background:linear-gradient(100deg,transparent calc(var(--gx) - 22%),rgba(255,255,255,.22) var(--gx),transparent calc(var(--gx) + 22%)),rgba(8,10,40,var(--shB))}
.b3 .sp{width:var(--t);height:var(--h);background:url(img/spine.webp) center/100% 100%;transform:translate(-50%,-50%) rotateY(-90deg) translateZ(calc(var(--w) / 2))}
.b3 .sp::after{background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.14) 30%,rgba(255,255,255,.04) 55%,rgba(0,0,0,.4)),rgba(8,10,40,var(--shS))}
.b3 .ed{width:calc(var(--t) - 1px);height:calc(var(--h) - 3px);background:linear-gradient(90deg,#cfc6ae,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 88%,#cfc6ae),repeating-linear-gradient(90deg,#e9e2cd 0 .6px,#f9f5ea .6px 1.8px);transform:translate(-50%,-50%) rotateY(90deg) translateZ(calc(var(--w) / 2 - 1.5px))}
.b3 .ed::after{background:rgba(8,10,40,var(--shE))}
.b3 .tp,.b3 .bt{width:calc(var(--w) - 3px);height:calc(var(--t) - 1px);background:linear-gradient(0deg,#cfc6ae,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 88%,#cfc6ae),repeating-linear-gradient(0deg,#e9e2cd 0 .6px,#f9f5ea .6px 1.8px)}
.b3 .tp{transform:translate(-50%,-50%) rotateX(90deg) translateZ(calc(var(--h) / 2 - 1.5px))}
.b3 .bt{transform:translate(-50%,-50%) rotateX(-90deg) translateZ(calc(var(--h) / 2 - 1.5px))}
.b3 .bt::after{background:rgba(8,10,40,.35)}
.v3d .floor{width:min(80%,320px);height:28px;margin-top:4px;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(5px);transform:scaleX(var(--fs,1))}
.v3d .open{margin-top:6px;cursor:pointer}
.firma{flex-basis:100%;text-align:center;font-size:12px;color:var(--muted);margin-top:-4px}
.firma a{color:var(--muted)}
@media (max-width:560px){.folio{min-width:0;flex-basis:100%;order:-1}.ttl p{letter-spacing:.12em}}
@media (prefers-reduced-motion:reduce){.hint,#shell{transition:none}}
</style>

<div class="app">
  <header>
    <img src="img/logo_crema.png" alt="Publicaciones Pneuma">

    <button id="fs">Pantalla completa</button>
    <div class="firma">Diseño y desarrollo: <a href="https://tecnoia.gt" target="_blank" rel="noopener">Tecnoia.gt</a></div>
  </footer>
</div>

  for (let j = Math.max(0, i - 4); j <= Math.min(els.length - 1, i + 8); j++){

    if (im && !im.src){ im.src = im.dataset.src; }
  }
}

  const ph = Math.floor(Math.min(h, (portrait ? w : w / 2) * 1.5));
  return { portrait, ph, pw: Math.floor(ph / 1.5) };
}

  let ry = -28, rx = 6, vy = 0, vx = 0, drag = false, lx = 0, ly = 0, lt = 0, sx = 0, sy = 0, st0 = 0, moved = 0;
  const r = a => a * Math.PI / 180, L = 15;
  const sh = n => Math.max(0, Math.min(.5, .5 * (1 - Math.max(0, Math.cos(r(n - L))) * .96)));
  const set = () => {
    b.style.setProperty('--ry', ry + 'deg'); b.style.setProperty('--rx', rx + 'deg');
    b.style.setProperty('--shF', sh(-ry).toFixed(3)); b.style.setProperty('--shB', sh(180 - ry).toFixed(3));
    b.style.setProperty('--shS', sh(-90 - ry).toFixed(3)); b.style.setProperty('--shE', sh(90 - ry).toFixed(3));
    b.style.setProperty('--gx', (50 + Math.sin(r(ry)) * 70).toFixed(1) + '%');
    fl.style.setProperty('--fs', (.3 + .7 * Math.abs(Math.cos(r(ry)))).toFixed(3));
  };
  v.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    drag = true; lx = sx = e.clientX; ly = sy = e.clientY; lt = st0 = performance.now(); vy = vx = 0; moved = 0;
    v.setPointerCapture(e.pointerId);
  });
  v.addEventListener('pointermove', e => {
    if (!drag) return;
    const now = performance.now(), dt = Math.max(8, now - lt);
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; lt = now;
    moved = Math.max(moved, Math.hypot(e.clientX - sx, e.clientY - sy));
    ry += dx * .6; rx = Math.max(-35, Math.min(35, rx - dy * .35));
    vy = dx * .6 * (16 / dt); vx = -dy * .35 * (16 / dt); set();
  });
  const up = e => {
    if (!drag) return; drag = false;
    // Si lo sostuvo quieto un rato antes de soltar, se queda quieto
    if (performance.now() - lt > 90){ vy = vx = 0; }
    // Un toque breve sobre el libro, sin arrastrar, lo abre
    if (e.type === 'pointerup' && moved < 8 && performance.now() - st0 < 350 && e.target.closest('#b3')) openBook();
  };
  v.addEventListener('pointerup', up); v.addEventListener('pointercancel', up);
  const loop = () => {
    if (!drag && (Math.abs(vy) > .02 || Math.abs(vx) > .02)){
      ry += vy; rx = Math.max(-35, Math.min(35, rx + vx)); vy *= .975; vx *= .9; set();
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop); set();
  function openBook(){
    vy = vx = 0;
    stage.classList.remove('closed'); v.classList.add('gone');
    pf.turnToPage(0); show(0); place(0); warm(0);
    setTimeout(() => pf.flipNext(), 350);
  }
  function closeBook(){
    pf.turnToPage(0); show(0); place(0);
    ry = -28; rx = 6; set();
    v.classList.remove('gone'); stage.classList.add('closed');
  }
  document.getElementById('abrir').onclick = openBook;
  document.getElementById('ver3d').onclick = closeBook;
  window.__openBook = openBook;
})();

// Sonido de papel sintetizado: ruido filtrado con envolvente corta.
let ac = null, soundOn = true, lastR = 0;
const snd = document.getElementById('snd');
snd.onclick = () => { soundOn = !soundOn; snd.textContent = 'Sonido: ' + (soundOn ? 'sí' : 'no'); snd.setAttribute('aria-pressed', soundOn); };
function rustle(){
  if (!soundOn) return;
  const now = performance.now(); if (now - lastR < 350) return; lastR = now;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.55, n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++){
      const t = i / n;
      const env = Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.15)), 1.6) * (0.6 + 0.4 * Math.random());
      d[i] = (Math.random() * 2 - 1) * env;
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.6;
    bp.frequency.setValueAtTime(1800, ac.currentTime); bp.frequency.linearRampToValueAtTime(4200, ac.currentTime + dur);
    const g = ac.createGain(); g.gain.value = 0.09;
    src.connect(bp).connect(g).connect(ac.destination); src.start();
  } catch (_) {}
}
